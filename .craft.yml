minVersion: '2.33.1'

versioning:
  policy: auto

changelog:
  policy: auto

preReleaseCommand: node --experimental-strip-types scripts/bump-version.ts
postReleaseCommand: ''

statusProvider:
  name: github
  config:
    contexts:
      - Linux arm64 build and acceptance
      - Script tooling checks

artifactProvider:
  name: github

requireNames:
  - /^shop-things-[0-9]+\.[0-9]+\.[0-9]+-linux-arm64\.deb$/
  - /^SHA256SUMS$/
  - /^shop-things-update-v1\.json$/
  - /^shop-things-update-v1\.sig$/

targets:
  - name: github
    tagPrefix: v
    includeNames: /^(shop-things-[0-9]+\.[0-9]+\.[0-9]+-linux-arm64\.deb|SHA256SUMS|shop-things-update-v1\.(json|sig))$/
