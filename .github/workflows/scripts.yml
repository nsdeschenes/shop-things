name: Script tooling

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'packages/electron/**'
      - 'packages/contract/**'
      - 'packages/db/**'
      - 'packages/interface/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.npmrc'
      - '.gitignore'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - '.github/workflows/scripts.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'packages/electron/**'
      - 'packages/contract/**'
      - 'packages/db/**'
      - 'packages/interface/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.npmrc'
      - '.gitignore'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - '.github/workflows/scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Script tooling checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Run script checks in parallel
        run: |
          pnpm exec oxfmt --check scripts &
          format_pid=$!
          pnpm typecheck scripts &
          typecheck_pid=$!
          pnpm exec oxlint scripts &
          lint_pid=$!
          pnpm test:scripts &
          tests_pid=$!
          result=0
          wait "$format_pid" || result=1
          wait "$typecheck_pid" || result=1
          wait "$lint_pid" || result=1
          wait "$tests_pid" || result=1
          exit "$result"
