name: Restricted update package transaction
on:
  pull_request:
    paths:
      [
        'packages/electron/**',
        'acceptance/update-apt/**',
        '.github/workflows/update-apt.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-apt:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build isolated native ARM64 package-policy fixture
        run: |
          uname -m
          docker version
          tar -c packages/electron/update acceptance/update-apt | docker build -f acceptance/update-apt/Dockerfile -t update-apt-fixture -
      - name: Exercise actual locked transactions in fresh disposable containers
        run: |
          set -euo pipefail
          mkdir -p apt-evidence
          for scenario in allowed allowed-multiarch allowed-multiarch-transition allowed-all breaks replaces trusted held dirty lock partial; do
            docker run --rm --network none update-apt-fixture "$scenario" | tee "apt-evidence/$scenario.log"
          done
      - name: Cut actual helper, locked hook and dpkg processes before selected instructions
        run: |
          set -euo pipefail
          for scenario in cut-helper cut-hook cut-dpkg cut-helper-at-apt; do
            docker run --rm --network none --cap-add SYS_PTRACE update-apt-fixture "$scenario" | tee "apt-evidence/$scenario.log"
          done
      - name: Preserve actual package evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arm64-actual-apt-evidence
          path: apt-evidence
