name: Package smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package-smoke:
    name: Linux glibc x64 shipped backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Clean source checks, package and shipped backend acceptance
        run: node scripts/acceptance.mjs
        env:
          ACCEPTANCE_REPORT_DIR: ${{ runner.temp }}/shop-things-acceptance
          SMOKE_EXECUTION_ENVIRONMENT: github-actions-ubuntu-24.04-native-linux-x64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-acceptance-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/shop-things-acceptance
          if-no-files-found: error
