name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared stable version without the v prefix
        required: true
        type: string
      release_sha:
        description: Full main commit SHA from the merged release PR
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: craft-release
  cancel-in-progress: false

jobs:
  publish:
    name: Sign and publish ${{ inputs.version }} at ${{ inputs.release_sha }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: update-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Verify the prepared version, merged PR and passing acceptance
        id: acceptance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          QUALIFIED_RELEASE_SHA: ${{ vars.UPDATE_RELEASE_QUALIFIED_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALIFIED_RELEASE_SHA" = "$RELEASE_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          node --experimental-strip-types scripts/check-release-version.ts
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" |
            jq -e --arg branch "release/$VERSION" --arg sha "$RELEASE_SHA" \
              'any(.[]; .merged_at != null and .base.ref == "main" and .head.ref == $branch and .merge_commit_sha == $sha)'
          for workflow in desktop.yml scripts.yml; do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" -f head_sha="$RELEASE_SHA" -f branch=main -f event=push |
              jq -e --arg sha "$RELEASE_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")] | first | .status == "completed" and .conclusion == "success"'
          done
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/desktop.yml/runs" -f head_sha="$RELEASE_SHA" -f branch=main -f event=push |
            jq -r --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")] | first | "run_id=\(.id)"' >> "$GITHUB_OUTPUT"
      - name: Verify independent signing approval and immutable release policy
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
        run: node --experimental-strip-types scripts/releaseProtection.ts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_sha }}
          path: release/assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.acceptance.outputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: renderer-acceptance-linux-arm64-${{ inputs.release_sha }}
          path: release/reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.acceptance.outputs.run_id }}
      - name: Sign only the accepted installer using installed public trust
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_TRUSTED_PUBLIC_KEYS_JSON: ${{ vars.UPDATE_TRUSTED_PUBLIC_KEYS_JSON }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ASSET_DIRECTORY: release/assets
          ACCEPTANCE_REPORT_PATH: release/reports/acceptance.json
        run: node --experimental-strip-types scripts/sign-update-release.ts
      - name: Create a complete release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/verify-release-tag.ts
          gh release create "v$VERSION" --draft --target "$RELEASE_SHA" --title "$VERSION" --notes-file CHANGELOG.md
          gh release upload "v$VERSION" release/assets/*
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > "$RUNNER_TEMP/release-draft.json"
      - name: Verify the complete uploaded draft before immutable publication
        env:
          UPDATE_TRUSTED_PUBLIC_KEYS_JSON: ${{ vars.UPDATE_TRUSTED_PUBLIC_KEYS_JSON }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERSION: ${{ inputs.version }}
          RELEASE_ASSET_DIRECTORY: release/assets
          RELEASE_DRAFT_PATH: ${{ runner.temp }}/release-draft.json
        run: node --experimental-strip-types scripts/validate-release-draft.ts
      - name: Publish the validated immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/verify-release-tag.ts
          gh release edit "v$VERSION" --draft=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" | jq -e '.immutable == true and .draft == false'
          node --experimental-strip-types scripts/verify-release-tag.ts
