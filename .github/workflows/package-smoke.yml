name: Package smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package-smoke:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - runner: macos-15
          #   platform: darwin
          #   arch: arm64
          #   script: dist:mac
          # - runner: windows-2022
          #   platform: win32
          #   arch: x64
          #   script: dist:win
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            script: dist:linux:x64
          # - runner: ubuntu-24.04-arm
          #   platform: linux
          #   arch: arm64
          #   script: dist:linux:arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.script }}
      - name: Smoke packaged database
        run: node --experimental-strip-types packages/electron/scripts/smoke-packaged.ts ${{ matrix.platform }} ${{ matrix.arch }}
        env:
          SMOKE_REPORT_PATH: ${{ runner.temp }}/package-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/package-smoke.json
