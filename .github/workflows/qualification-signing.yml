name: Prepare qualification signing bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared stable version without the v prefix
        required: true
        type: string
      release_sha:
        description: Full main commit SHA from the merged release PR
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: qualification-signing-bundle
  cancel-in-progress: false

jobs:
  qualification:
    name: Sign qualification candidate ${{ inputs.version }} at ${{ inputs.release_sha }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: update-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Verify the prepared version, merged PR and passing acceptance
        id: acceptance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CI_EVIDENCE_DIRECTORY: release/provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          node --experimental-strip-types scripts/check-release-version.ts
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" |
            jq -e --arg branch "release/$VERSION" --arg sha "$RELEASE_SHA" \
              'any(.[]; .merged_at != null and .base.ref == "main" and .head.ref == $branch and .merge_commit_sha == $sha)'
          node --experimental-strip-types scripts/verify-update-ci.ts
      - name: Verify independent signing approval and immutable release policy
        env:
          GH_TOKEN: ${{ secrets.RELEASE_POLICY_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SIGNING_PROTECTION_REPORT_PATH: release/provenance/signing-approval.json
        run: node --experimental-strip-types scripts/releaseProtection.ts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release_sha }}
          path: release/assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.acceptance.outputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: renderer-acceptance-linux-arm64-${{ inputs.release_sha }}
          path: release/reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.acceptance.outputs.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: arm64-actual-apt-evidence-${{ inputs.release_sha }}
          path: release/apt-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.acceptance.outputs.apt_run_id }}
      - name: Sign only the accepted installer using installed public trust
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          UPDATE_TRUSTED_PUBLIC_KEYS_JSON: ${{ vars.UPDATE_TRUSTED_PUBLIC_KEYS_JSON }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_ASSET_DIRECTORY: release/assets
          ACCEPTANCE_REPORT_PATH: release/reports/acceptance.json
          SIGNING_PUBLIC_POLICY_PATH: release/provenance/approved-policy.json
        run: node --experimental-strip-types scripts/sign-update-release.ts
      - name: Retain the public approved qualification bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-bundle-${{ inputs.release_sha }}
          path: |
            release/assets/*
            release/reports/*
            release/provenance/*
            release/apt-evidence/*
          if-no-files-found: error
