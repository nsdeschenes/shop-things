name: Desktop application

on:
  pull_request:
    paths:
      - 'packages/electron/**'
      - 'packages/interface/**'
      - 'packages/contract/**'
      - 'packages/db/**'
      - 'acceptance/**'
      - 'scripts/**'
      - '!scripts/test/**'
      - '!scripts/vitest.config.ts'
      - '!scripts/tsconfig.test.json'
      - 'index.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.npmrc'
      - '.gitignore'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - '.craft.yml'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/prepare-release.yml'
      - '.github/workflows/publish-release.yml'
  push:
    branches: [main]
    paths:
      - 'packages/electron/**'
      - 'packages/interface/**'
      - 'packages/contract/**'
      - 'packages/db/**'
      - 'acceptance/**'
      - 'scripts/**'
      - '!scripts/test/**'
      - '!scripts/vitest.config.ts'
      - '!scripts/tsconfig.test.json'
      - 'index.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.npmrc'
      - '.gitignore'
      - '.oxlintrc.json'
      - '.oxfmtrc.json'
      - '.craft.yml'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/prepare-release.yml'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x64 build and acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install locked workspace and Chromium desktop dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - name: Check formatting
        run: pnpm fmt:check
      - name: Build shared package declarations for lint
        run: pnpm prepare:backend
      - name: Check lint
        run: pnpm lint
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Run unit tests
        run: |
          mkdir -p "$ACCEPTANCE_REPORT_DIR"
          pnpm --filter electron exec node -e 'require("electron/install.js")'
          pnpm test --packages-only
          git rev-parse HEAD > "$ACCEPTANCE_REPORT_DIR/source-checks.commit"
        env:
          ACCEPTANCE_REPORT_DIR: ${{ runner.temp }}/shop-things-acceptance
      - name: Enable Electron namespace sandbox on the temporary runner
        run: |
          # Ubuntu 24.04 blocks unprivileged user namespaces for unpacked Electron binaries.
          # Allow Chromium's namespace sandbox for direct packaged and watcher launches.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user true
      - name: Build, renderer, packaged and watcher acceptance
        run: xvfb-run -a node --experimental-strip-types scripts/acceptance.ts --reuse-source-checks
        env:
          ACCEPTANCE_REPORT_DIR: ${{ runner.temp }}/shop-things-acceptance
          SMOKE_EXECUTION_ENVIRONMENT: github-actions-ubuntu-24.04-native-linux-x64
      - name: Stage the tested Linux x64 release
        if: github.event_name == 'push'
        run: node --experimental-strip-types scripts/stage-release.ts
        env:
          ACCEPTANCE_REPORT_DIR: ${{ runner.temp }}/shop-things-acceptance
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: ${{ github.sha }}
          path: release/assets/*
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-acceptance-linux-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/shop-things-acceptance
            acceptance-reports/renderer
          if-no-files-found: error
          overwrite: true
